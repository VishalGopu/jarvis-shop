<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chitragupta for Shops</title>
<style>
:root{--bg:#0b1220;--card:#141c2e;--fg:#e8eefc;--mut:#8b97b5;--acc:#2dd4bf;--warn:#fbbf24}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:18px system-ui,sans-serif;min-height:100vh;display:grid;grid-template-columns:1.1fr 1fr;gap:16px;padding:16px}
@media(max-width:800px){body{grid-template-columns:1fr}}
.card{background:var(--card);border-radius:18px;padding:20px}h1{margin:0 0 4px;font-size:26px}.mut{color:var(--mut);font-size:15px}
#face{font-size:64px;text-align:center}#say{min-height:56px;font-size:22px;text-align:center;margin:8px 0}
button{font:inherit;border:0;border-radius:14px;padding:16px 22px;background:var(--acc);color:#04201c;font-weight:700;cursor:pointer}
button.ghost{background:#26314d;color:var(--fg)}#talk{width:100%;font-size:22px;padding:22px}#talk.rec{background:#f87171}
.menu{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}.menu button{background:#1d2740;color:var(--fg);font-weight:500;text-align:left;padding:10px 12px}
table{width:100%;border-collapse:collapse}td{padding:6px 0;border-bottom:1px solid #26314d}td:last-child{text-align:right}td.q{white-space:nowrap;text-align:center}td.q button,td button.ghost{padding:2px 10px;font-size:18px}
#qr img{width:260px;background:#fff;border-radius:12px;display:block;margin:10px auto}.big{font-size:56px;font-weight:800;text-align:center;color:var(--acc)}
.row{display:flex;gap:8px;margin-top:10px}input{flex:1;font:inherit;padding:12px;border-radius:12px;border:1px solid #26314d;background:#0e1626;color:var(--fg)}
</style></head><body>
<div class="card"><h1 id="shop">Chitragupta</h1><div class="mut">Speak in any Indian language · hold the button and talk</div>
<div style="text-align:right"><button class="ghost" id="role" style="padding:6px 10px;font-size:13px">↩ role</button> <button class="ghost" id="srv" style="padding:6px 10px;font-size:13px">⚙ server</button></div><div id="face">🤖</div><div id="say">Hi! What would you like to order?</div>
<button id="talk">🎤 Hold to speak</button>
<div class="row"><input id="txt" placeholder="…or type (e.g. two dosa and a chai)"><button class="ghost" id="send">Send</button></div>
<p class="mut">Tap to add:</p><div class="menu" id="menu"></div></div>
<div class="card"><h2 style="margin-top:0">Your order</h2><table id="cart"></table><h2 id="total" style="text-align:right"></h2>
<div class="row" id="tablebox" style="display:none"><input id="table" placeholder="Table number" inputmode="numeric"></div>
<div class="row"><button id="pay">Pay with UPI</button><button class="ghost" id="clear">Clear</button></div>
<div id="qr"></div><div id="status" class="mut"></div><div id="pickup" class="mut" style="margin-top:14px;font-size:20px"></div></div>
<script type="module">
import { recordWav, say, post, get, setServer, base, events, goRole, speakText } from "/common.js";
import { fmtQty, unitPrice } from "/units.js";
setServer(false);
let cfg, cart = [], lang = "en-IN", orderId = null, poll = null, lines = [], total = 0;
const $ = (id) => document.getElementById(id);
cfg = { menu: { shop: "Chitragupta", items: [] }, mock: true, profile: { payWhen: "before", words: {} } };
const after = () => cfg.profile?.payWhen === "after", W = () => cfg.profile?.words || {};
async function loadCfg() {
  try {
    cfg = await get("/api/config"); $("shop").textContent = cfg.menu.shop + " · Chitragupta";
    $("menu").innerHTML = cfg.menu.items.map((i) => i.soldOut ? `<button disabled style="opacity:.4">${i.name}<br><span class="mut">Sold out</span></button>` : `<button data-add="${i.id}">${i.name}<br><span class="mut">${unitPrice(i)}${i.stock != null && i.stock <= 3 * (i.step || 1) ? ` · only ${fmtQty(i.stock, i.unit)} left` : ""}</span></button>`).join("");
    $("pay").textContent = after() ? "Send to " + (W().staff || "kitchen").toLowerCase() : "Pay with UPI"; $("tablebox").style.display = cfg.profile?.table ? "" : "none";
    $("txt").placeholder = after() && cfg.profile.fulfil === "pack" ? "…or type (e.g. 1 kg rice, half kg sugar)" : "…or type (e.g. two dosa and a chai)";
    $("status").textContent = "Connected · parser: " + cfg.parser;
    loadReady();
  } catch (e) { $("say").textContent = "Can't reach server " + (base() || location.origin) + " — tap ⚙ server and enter the right address."; }
}
$("menu").onclick = (e) => { const b = e.target.closest("button"); if (!b?.dataset.add) return; const i = cfg.menu.items.find((x) => x.id === b.dataset.add); turn({ add: { id: i.id, qty: i.step || 1 } }); };
const by = () => Object.fromEntries(cfg.menu.items.map((i) => [i.id, i]));
const money = () => { const b = by(); lines = cart.filter((c) => b[c.id]).map((c) => ({ id: c.id, name: b[c.id].name, qty: c.qty, price: b[c.id].price, unit: b[c.id].unit, note: c.note, amount: Math.round(c.qty * b[c.id].price) })); total = lines.reduce((s, l) => s + l.amount, 0); };
function render() {
  $("cart").innerHTML = lines.map((l) => `<tr><td>${l.name}<br><span class="mut" data-act="note" data-id="${l.id}" style="cursor:pointer">${l.note ? "📝 " + l.note : "＋ note (quality / brand)"}</span></td><td class="q"><button class="ghost" data-act="dec" data-id="${l.id}">−</button> ${fmtQty(l.qty, l.unit)} <button class="ghost" data-act="inc" data-id="${l.id}">+</button></td><td>₹${l.amount ?? Math.round(l.qty * l.price)}</td><td><button class="ghost" data-act="del" data-id="${l.id}" title="Remove">✕</button></td></tr>`).join("") || `<tr><td class="mut">Empty</td></tr>`;
  $("total").textContent = total ? "Total ₹" + total : "";
}
$("cart").onclick = async (e) => {
  const b = e.target.closest("[data-act]"); if (!b) return; const { act, id } = b.dataset;
  if (orderId) await cancelPending(); if (orderId) return;           // can't edit while payment is already received
  const c = cart.find((x) => x.id === id); if (!c) return; const st = by()[id]?.step || 1;
  if (act === "note") { const n = prompt("Note for " + by()[id].name + " (quality, brand, size…)", c.note || ""); if (n !== null) c.note = n.trim().slice(0, 60) || undefined; money(); return render(); }
  if (act === "inc") c.qty = Math.round((c.qty + st) * 100) / 100; else if (act === "dec") c.qty = Math.round((c.qty - st) * 100) / 100; else c.qty = 0;
  cart = cart.filter((x) => x.qty > 0.001); money(); render();
};
async function cancelPending() {                                      // customer changes mind after the QR is shown
  if (!orderId) return;
  if (readyOrders.some((o) => o.id === orderId)) return;   // a finished order being billed is not cancellable
  const id = orderId; clearInterval(poll);
  const r = await post(`/api/order/${id}/cancel`, {});
  if (r.error) { $("status").textContent = "Payment already received for " + id; startPoll(); return; }   // too late: it was paid
  orderId = null; $("qr").innerHTML = ""; $("status").textContent = "Order unlocked — edit and pay again.";
}
async function turn(payload) {
  if (orderId) await cancelPending(); if (orderId) return;
  $("face").textContent = "🤔";
  const r = await post("/api/turn", { ...payload, cart, lang });
  if (r.error) { $("face").textContent = "🤖"; $("say").textContent = r.error; return; }
  $("face").textContent = "🤖"; if (r.heard) $("say").innerHTML = `<span class="mut">“${r.heard}”</span><br>${r.reply}`; else $("say").textContent = r.reply;
  if (r.timings) $("status").textContent = `stt ${r.timings.stt ?? "-"}ms · parse ${r.timings.parse ?? "-"}ms (${r.timings.via}) · tts ${r.timings.tts ?? "-"}ms`;
  cart = r.cart || cart; lines = r.lines || lines; total = r.total ?? total; lang = r.lang || lang; render(); if (!payload.add) say(r.audio, r.reply, lang);
  if (r.action === "checkout") checkout(); if (r.action === "clear") reset();
}
function reset() { cart = []; lines = []; total = 0; orderId = null; clearInterval(poll); $("qr").innerHTML = ""; $("status").textContent = ""; render(); }
$("clear").onclick = reset;
$("send").onclick = () => { const t = $("txt").value.trim(); if (t) { $("txt").value = ""; turn({ text: t }); } };
$("txt").onkeydown = (e) => e.key === "Enter" && $("send").click();
let stop; const talk = $("talk");
const start = async (e) => { e.preventDefault(); if (stop) return; talk.classList.add("rec"); talk.textContent = "● Listening… release to send"; let res; const p = new Promise((r) => (res = r)); stop = res;
  try { const wav = await recordWav(p); stop = null; talk.classList.remove("rec"); talk.textContent = "🎤 Hold to speak"; turn({ audio: wav }); } catch (err) { stop = null; talk.classList.remove("rec"); $("say").textContent = "Mic: " + err.message; } };
const end = () => stop && stop();
talk.onmousedown = talk.ontouchstart = start; talk.onmouseup = talk.onmouseleave = talk.ontouchend = end;
$("pay").onclick = () => cart.length && checkout();
async function checkout() {
  if (orderId || !cart.length) return;
  const r = await post("/api/checkout", { cart, lang, table: $("table").value }); if (r.error) { $("say").textContent = r.error; return; } orderId = r.order.id;
  if (r.payLater) {                                                    // pay-after shop: the slip is with the team; bill when it is packed
    $("qr").innerHTML = `<div class="big">#${r.order.number}</div>${r.pin ? `<div class="mut" style="text-align:center">Pickup code</div><div class="big" style="font-size:44px;letter-spacing:8px">${r.pin}</div>` : ""}<div class="mut" style="text-align:center">${W().station || "Kitchen"}: your slip is being handled. Keep your number and code for pickup.</div>`; $("status").textContent = "Sent to " + (W().staff || "kitchen").toLowerCase() + " ✔ · total ₹" + r.order.total;
    cart = []; lines = []; total = 0; orderId = null; render(); loadReady(); setTimeout(() => { if (!orderId) { $("qr").innerHTML = ""; $("status").textContent = ""; } }, 12000); return; }
  $("qr").innerHTML = `<img src="${r.qr}" alt="UPI QR"><div class="mut" style="text-align:center">Scan with Paytm / any UPI app</div>` + `<div class="row"><button class="ghost" id="edit">✏ Edit order</button>${cfg.mock ? `<button class="ghost" id="sim">Simulate payment (demo)</button>` : ""}</div>`;
  $("status").textContent = "Waiting for payment… " + r.order.id;
  if (cfg.mock) $("sim").onclick = () => post(`/api/order/${orderId}/mock-pay`, {});
  $("edit").onclick = cancelPending; startPoll();
}
function startPoll() {
  clearInterval(poll);
  poll = setInterval(async () => { const s = await get(`/api/order/${orderId}`); const st = s.order?.status;
    if (st === "cancelled") { clearInterval(poll); return; }
    if (st && st !== "awaiting_payment") { clearInterval(poll);
      $("qr").innerHTML = `<div class="big">#${s.order.number}</div>${s.pin ? `<div class="mut" style="text-align:center">Pickup code</div><div class="big" style="font-size:44px;letter-spacing:8px">${s.pin}</div>` : ""}`; $("status").textContent = "Paid ✔ Sent to " + (W().station || "kitchen").toLowerCase() + ". Wait for your number.";
      if (s.announce) say(s.announce.audio, s.announce.text, lang); setTimeout(reset, 25000); } }, 2000);
}
$("role").onclick = goRole;
let readyOrders = [];
async function loadReady() { try { const k = await get("/api/kitchen"); readyOrders = k.orders.filter((o) => o.status === "ready");
  $("pickup").innerHTML = !readyOrders.length ? "" : (() => { const owe = readyOrders.filter((o) => after() || o.payLater), plain = readyOrders.filter((o) => !(after() || o.payLater));
    return (owe.length ? `Ready — collect payment:<div>${owe.map((o) => `<button class="ghost" data-bill="${o.id}" style="margin:4px 6px 0 0">#${o.number}${o.source === "phone" ? " 📞" : ""} · ₹${o.total}</button>`).join("")}</div>` : "") + (plain.length ? `Ready for pickup: <b style="color:var(--acc)">${plain.map((o) => "#" + o.number).join("  ")}</b>` : ""); })(); } catch {} }
$("pickup").onclick = async (e) => { const id = e.target.closest("[data-bill]")?.dataset.bill; if (!id) return; if (orderId) return; const o = readyOrders.find((x) => x.id === id);
  const pin = prompt("Customer's pickup code for #" + o.number + " (Cancel to stop)"); if (pin === null) return;
  const r = await post(`/api/order/${id}/bill`, { pin }); if (r.error) { $("status").textContent = r.error; return; } orderId = id; $("total").textContent = "Bill ₹" + r.order.total + " · #" + r.order.number;
  $("qr").innerHTML = `<img src="${r.qr}" alt="UPI QR"><div class="mut" style="text-align:center">Final bill ₹${r.order.total} — scan to pay</div><div class="row"><button class="ghost" id="cash">💵 Cash received</button>${cfg.mock ? `<button class="ghost" id="sim">Simulate payment (demo)</button>` : ""}<button class="ghost" id="back">Back</button></div>`;
  $("status").textContent = "Waiting for payment… " + id; if (cfg.mock) $("sim").onclick = () => post(`/api/order/${id}/mock-pay`, {});
  const done = () => { clearInterval(poll); orderId = null; $("qr").innerHTML = ""; $("total").textContent = ""; $("status").textContent = "Paid ✔ #" + r.order.number + " handed over."; loadReady(); };
  $("cash").onclick = async () => { const c = await post(`/api/order/${id}/cash`, { pin }); if (c.error) { $("status").textContent = c.error; return; } done(); }; $("back").onclick = () => { clearInterval(poll); orderId = null; $("qr").innerHTML = ""; $("total").textContent = ""; $("status").textContent = ""; };
  clearInterval(poll); poll = setInterval(async () => { const s = await get(`/api/order/${id}`); if (s.order?.status === "delivered") { if (s.announce) say(s.announce.audio, s.announce.text, lang); done(); } }, 2000); };
events((e) => { if (e.type === "menu") loadCfg(); if (e.type === "ready") speakText(e.text, e.lang); if (e.type !== "menu") loadReady(); });   // this speaker calls out finished orders
$("srv").onclick = () => { setServer(true); location.reload(); };
$("say").title = "";
render();
loadCfg();
</script></body></html>
