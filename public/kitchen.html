<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jarvis Kitchen</title>
<style>
:root{--bg:#0b1220;--card:#141c2e;--fg:#e8eefc;--mut:#8b97b5;--acc:#2dd4bf;--warn:#fbbf24;--bad:#f87171}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:18px system-ui,sans-serif;padding:14px}
h1{margin:0;font-size:24px}.top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}.mut{color:var(--mut);font-size:15px}
button{font:inherit;border:0;border-radius:12px;padding:12px 16px;background:var(--acc);color:#04201c;font-weight:700;cursor:pointer}
button.ghost{background:#26314d;color:var(--fg)}button.rec{background:var(--bad)}.sm{padding:6px 10px;font-size:13px}.hide{display:none!important}
.pick button{display:block;width:100%;margin:10px 0;text-align:left;background:var(--card);color:var(--fg);padding:18px;font-size:20px;border:2px solid transparent}.pick button:hover{border-color:var(--acc)}
.task{background:var(--card);border-radius:20px;padding:24px;margin:16px 0;border:3px solid var(--acc);text-align:center}.task .big{font-size:40px;font-weight:800;margin:8px 0}.task .for{font-size:24px;color:var(--warn)}
.task .row{display:flex;gap:10px;justify-content:center;margin-top:18px;flex-wrap:wrap}.task .row button{font-size:22px;padding:16px 26px}
.idle{background:var(--card);border-radius:20px;padding:28px;margin:16px 0;text-align:center}.start{font-size:26px;padding:22px 30px;width:100%;margin:20px 0}
.strip{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px;margin:12px 0}.cf{background:var(--card);border-radius:14px;padding:10px 12px;font-size:15px}.cf b{font-size:17px}.on{color:var(--acc)}.off{color:var(--mut)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;margin-top:12px}
.o{background:var(--card);border-radius:16px;padding:16px;border:2px solid transparent}.o.cooking.first{border-color:var(--acc)}.o.ready{border-color:var(--warn)}
.o b{font-size:30px}.t{float:right;font-variant-numeric:tabular-nums}.t.late{color:var(--bad)}
.ln{display:flex;justify-content:space-between;align-items:center;margin:4px 0;gap:6px}.ln.done{opacity:.45;text-decoration:line-through}.ln button{padding:4px 12px}.tag{font-size:12px;background:#26314d;border-radius:8px;padding:2px 6px;margin-left:4px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}.chip{background:#1d2740;color:var(--fg);padding:6px 10px;border-radius:999px;font-size:14px;font-weight:500;cursor:pointer}.chip.offc{background:#4b1d1d;text-decoration:line-through}
</style></head><body>
<div class="top"><h1 id="title">👨‍🍳 Kitchen</h1><div><button class="ghost sm" id="switch">⇄ who am I</button> <button class="ghost sm" id="role">↩ role</button> <button class="ghost sm" id="srv">⚙ server</button></div></div>
<p id="note" class="mut"></p>

<div id="pick" class="pick hide"></div>

<div id="chefView" class="hide">
  <button id="startShift" class="start hide">▶ Start shift</button>
  <div id="taskBox"></div>
  <p style="text-align:center"><button class="ghost sm" id="endShift">End shift</button></p>
</div>

<div id="boardView" class="hide">
  <div class="strip" id="chefStrip"></div>
  <div class="chips" id="chips"></div>
  <p><button id="talk">🎤 Hold & say “order 104 ready” / “dosa ready”</button> <span id="heard" class="mut"></span></p>
  <div id="upcoming"></div>
  <div class="grid" id="list"></div>
</div>

<script type="module">
import { recordWav, say, post, get, setServer, events, speakText, beep, goRole } from "/common.js";
import { fmtQty, lineText } from "/units.js";
setServer(false);
const $ = (id) => document.getElementById(id);
const ls = { get: (k) => { try { return localStorage.getItem(k); } catch { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch {} } };
let who = ls.get("kwho"), upcoming = [], orders = [], chefs = [], mode = "station", menu = [], fulfil = "kitchen", W = {}, payAfter = false;
const staff = () => W.staff || "Chef", pack = () => fulfil === "pack";
const clock = (ms) => new Date(ms).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
const fmt = (ms) => { const s = Math.max(0, Math.floor(ms / 1000)); return String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0"); };
const note = (t) => ($("note").textContent = t);
const chefName = (id) => chefs.find((c) => c.id === id)?.name;

async function load() {
  try { const k = await get("/api/kitchen"); orders = k.orders; upcoming = k.upcoming || []; chefs = k.chefs; mode = k.mode; fulfil = k.fulfil || "kitchen"; W = k.words || {}; const cfg = await get("/api/config"); menu = cfg.menu.items; payAfter = cfg.profile?.payWhen === "after"; }
  catch { note("Can't reach server — tap ⚙ server"); return; }
  render();
}
function render() {
  $("pick").classList.add("hide"); $("chefView").classList.add("hide"); $("boardView").classList.add("hide");
  if (who && who !== "board" && !chefs.some((c) => c.id === who)) who = null;
  if (!who) {
    $("title").textContent = "👨‍🍳 Who is using this device?";
    document.title = "Jarvis " + (W.station || "Kitchen");
    $("pick").innerHTML = chefs.map((c) => `<button data-who="${c.id}">👨‍🍳 ${c.name}<br><span class="mut">${c.skills.length && !pack() ? "does: " + c.skills.map((s) => menu.find((m) => m.id === s)?.name || s).join(", ") : pack() ? "packs orders" : "any dish"}${c.online ? " · on shift" : ""}</span></button>`).join("")
      + `<button data-who="board">📋 Board (manager view)<br><span class="mut">All orders, out-of-stock, assign by voice</span></button>` + (chefs.length ? "" : `<p class="mut">No ${staff().toLowerCase()}s set up yet. Use Owner → ${W.setup || "Kitchen setup"}, or open the Board.</p>`);
    $("pick").classList.remove("hide"); return;
  }
  who === "board" ? renderBoard() : renderChef();
}

// ---------------- chef device: one task at a time
function renderChef() {
  const me = chefs.find((c) => c.id === who); $("title").textContent = "👨‍🍳 " + me.name + (me.online ? " · on shift" : "");
  $("chefView").classList.remove("hide"); $("startShift").classList.toggle("hide", me.online); $("endShift").classList.toggle("hide", !me.online);
  if (!me.online) { $("taskBox").innerHTML = `<div class="idle mut">Tap “Start shift” to receive orders. Tasks are spoken to you here.</div>`; return; }
  if (me.task) {
    const slip = pack(), items = slip ? me.task.items.map((i) => `<div class="ln ${i.done >= i.total ? "done" : ""}" style="font-size:24px;text-align:left"><span>${fmtQty(i.total, i.unit)} × ${i.name}${i.note ? `<br><b style="color:var(--warn);font-size:18px">📝 ${i.note}</b>` : ""}${i.unavailable ? " <span class='tag'>not available</span>" : ""}</span>${i.done >= i.total ? "" : `<span><button class="ghost" data-tick="${i.id}">✓ got it</button> <button class="ghost" data-na="${i.id}">✗ none</button></span>`}</div>`).join("") : me.task.items.map((i) => `${lineText({ ...i, qty: i.qty })}`).join("<br>");
    $("taskBox").innerHTML = `<div class="task"><div class="mut">${slip ? "SLIP" : mode === "order" ? "WHOLE ORDER" : "YOUR TASK"} <span data-since="${me.task.since}">${fmt(Date.now() - me.task.since)}</span></div><div class="${slip ? "" : "big"}">${items}</div><div class="for">for order #${me.task.number}${me.task.table ? " · table " + me.task.table : ""}</div>
      <div class="row"><button id="done">${pack() ? "✅ All packed" : "✅ Done"}</button><button class="ghost" id="repeat">🔊 Repeat</button><button class="ghost" id="xfer">⇄ Transfer</button><button class="ghost" id="talkDone">🎤 Hold: “done”</button></div><div id="xferBox"></div></div>${queuedHtml(me)}`;
    $("done").onclick = () => complete({});
    $("taskBox").onclick = async (e) => { const d = e.target.closest("[data-tick],[data-na]")?.dataset; if (!d) return;
      try { if (d.tick) await post("/api/ready", { number: me.task.number, lineId: d.tick }); else { const r = await post("/api/line/unavailable", { number: me.task.number, lineId: d.na }); if (r.error) note(r.error); } } catch (err) { note("Failed: " + err.message); } load(); };
    $("xfer").onclick = () => {
      const others = chefs.filter((c) => c.online && c.id !== me.id);
      $("xferBox").innerHTML = `<div style="margin-top:14px" class="mut">Give this to…</div><div class="row">${others.map((c) => `<button class="ghost" data-to="${c.id}">${c.name}${c.task ? " (busy — next)" : " (free)"}</button>`).join("")}${others.length ? `<button class="ghost" data-to="any">Anyone free</button>` : `<span class="mut">No other chef is on shift</span>`}</div>`;
      $("xferBox").onclick = async (e) => { const to = e.target.closest("[data-to]")?.dataset.to; if (!to) return;
        try { const r = await post(`/api/chefs/${me.id}/transfer`, { to }); note(r.error ? "Couldn't transfer: " + r.error : "Passed to " + r.to + "."); } catch (err) { note("Failed: " + err.message); } load(); };
    };
    $("repeat").onclick = () => speakText(taskText(me), me.lang);
    const t = $("talkDone"); let stop;
    const start = async (e) => { e.preventDefault(); if (stop) return; t.classList.add("rec"); let res; const p = new Promise((r) => (res = r)); stop = res;
      try { const wav = await recordWav(p); stop = null; t.classList.remove("rec"); complete({ audio: wav }); } catch (err) { stop = null; t.classList.remove("rec"); note("Mic: " + err.message); } };
    t.onmousedown = t.ontouchstart = start; t.onmouseup = t.onmouseleave = t.ontouchend = () => stop && stop();
  } else {
    const waiting = orders.filter((o) => o.status === "cooking").reduce((n, o) => n + o.lines.filter((l) => (l.done || 0) < l.qty && !l.chefId).length, 0);
    $("taskBox").innerHTML = `<div class="idle"><div class="big" style="font-size:30px">✔ All clear</div><div class="mut">Waiting for the next order… ${waiting ? waiting + " item(s) queued for others" : ""}</div></div>${queuedHtml(me)}`;
  }
}
const queuedHtml = (me) => (me.queued || []).length ? `<div class="idle" style="padding:14px"><div class="mut">Next for you (passed by a colleague)</div>${me.queued.map((q) => `<div>${q.items.map((i) => lineText(i)).join(", ")} · order #${q.number}${q.from ? ` · from ${q.from}` : ""}</div>`).join("")}</div>` : "";
const taskText = (me) => me.task ? (mode === "order" ? `Order ${me.task.number}: ` : "") + me.task.items.map((i) => lineText(i, true)).join(", ") + (mode === "order" ? "" : ` for order ${me.task.number}`) : "";
async function complete(body) {
  try { const r = await post(`/api/chefs/${who}/complete`, body);
    note(r.completed ? (r.orderReady ? `Order #${r.order.number} complete — announced at the counter.` : "Done. Next task coming…") : (r.heard ? `Heard “${r.heard}” — say “done” to finish.` : "Nothing to complete."));
  } catch (e) { note("Failed: " + e.message); } load();
}
$("startShift").onclick = async () => { beep(); await post(`/api/chefs/${who}/online`, { online: true }); load(); };
$("endShift").onclick = async () => { await post(`/api/chefs/${who}/online`, { online: false }); load(); };

// ---------------- board (manager): all orders, chef status, sold-out, voice by order/dish
function renderBoard() {
  $("title").textContent = "📋 Board"; $("boardView").classList.remove("hide");
  $("chefStrip").innerHTML = chefs.map((c) => `<div class="cf"><b>${c.name}</b> <span class="${c.online ? "on" : "off"}">${c.online ? "● on shift" : "○ off"}</span><br>${c.task ? `${c.task.items.map((i) => lineText(i)).join(", ")} → #${c.task.number} <button class="ghost sm" data-free="${c.id}">free</button>` : `<span class="mut">idle</span>`}${(c.queued || []).length ? `<br><span class="mut">next: ${c.queued.map((q) => "#" + q.number).join(", ")}</span>` : ""}</div>`).join("") || `<div class="mut">Nobody configured (Owner → ${W.setup || "Kitchen setup"}).</div>`;
  $("chips").innerHTML = menu.map((i) => `<span class="chip ${i.soldOut ? "offc" : ""}" data-so="${i.id}" data-v="${i.soldOut ? 0 : 1}">${i.name}${i.soldOut ? " · out" : ""}</span>`).join("");
  $("title").textContent = "📋 " + (W.station || "Kitchen") + " board";
  $("upcoming").innerHTML = upcoming.length ? `<div class="o" style="margin-bottom:12px"><b>📞 Upcoming phone orders</b> <span class="mut">starts ${upcoming[0].startAt ? "at " + clock(upcoming[0].startAt) : "later"}, reminder spoken then</span>${upcoming.map((o) => `<div class="ln"><span><b>#${o.number}</b> due ${clock(o.pickupAt)} · ${o.lines.map((l) => `${fmtQty(l.qty, l.unit)} × ${l.name}${l.note ? " 📝" + l.note : ""}`).join(", ")}</span><span class="mut">starts ${clock(o.startAt)}</span></div>`).join("")}</div>` : "";
  const first = orders.find((o) => o.status === "cooking");
  $("list").innerHTML = orders.map((o) => `<div class="o ${o.status} ${o === first ? "first" : ""}">${o.source === "phone" && o.pickupAt ? `<span class="t ${o.status === "cooking" && Date.now() > o.pickupAt ? "late" : ""}">due ${clock(o.pickupAt)}</span>` : `<span class="t ${o.status === "cooking" && Date.now() - (o.startedAt || o.paidAt) > 600000 ? "late" : ""}" data-since="${o.startedAt || o.paidAt}">${fmt(Date.now() - (o.startedAt || o.paidAt))}</span>`}<b>#${o.number}</b>${o.source === "phone" ? ` <span class="tag">📞 phone · pay at pickup</span>` : ""}${o.table ? ` <span class="tag">table ${o.table}</span>` : ""}
    ${o.lines.map((l) => { const done = (l.done || 0) >= l.qty; return `<div class="ln ${done ? "done" : ""}"><span>${fmtQty(l.done || 0, l.unit)}/${fmtQty(l.qty, l.unit)} × ${l.name}${l.note ? ` <b title="note">📝${l.note}</b>` : ""}${l.chefId ? `<span class="tag">${chefName(l.chefId) || ""}</span>` : ""}</span>${o.status === "cooking" && !done ? `<button class="ghost" data-line="${o.number}|${l.id}">✓</button>` : ""}</div>`; }).join("")}
    <div class="mut">${o === first ? "← oldest" : o.status}</div>
    ${o.status === "cooking" ? `<p><button data-ready="${o.number}">Order ready</button></p>` : `<p>${(payAfter || o.payLater) && !o.paidAt ? `<span class="mut">₹${o.total} · pay at counter</span> <button class="ghost" data-cash="${o.id}">💵 Cash received</button>` : `<button class="ghost" data-deliver="${o.number}">Picked up ✔</button>`}</p>`}</div>`).join("") || `<p class="mut">No active orders.</p>`;
}
async function send(body) {
  try { const r = await post("/api/ready", body);
    if (!r.results?.length) { $("heard").textContent = `Nothing to mark${r.heard ? ` for “${r.heard}”` : ""}. Say “order 104 ready”, “dosa ready” or “2 dosa ready”.`; return load(); }
    const done = r.results.filter((x) => x.completed).map((x) => "#" + x.number), part = r.results.filter((x) => !x.completed).map((x) => "#" + x.number);
    $("heard").textContent = (r.heard ? `Heard “${r.heard}” → ` : "") + [done.length ? `ready: ${done.join(", ")}` : "", part.length ? `partly done: ${part.join(", ")}` : ""].filter(Boolean).join(" · ");
  } catch (e) { $("heard").textContent = "Failed: " + e.message; } load();
}
$("boardView").onclick = async (e) => {
  const el = e.target.closest("button, [data-so]"); if (!el) return; const d = el.dataset;
  if (d.line) { const [n, id] = d.line.split("|"); send({ number: +n, lineId: id }); }
  else if (d.ready) send({ number: +d.ready });
  else if (d.cash) { await post(`/api/order/${d.cash}/cash`, {}); load(); }
  else if (d.deliver) { const pin = prompt("Customer's 4-digit pickup code for #" + d.deliver); if (pin === null) return;
    let r = await post("/api/deliver", { number: +d.deliver, pin }); if (r.error && confirm("Wrong code. Hand over anyway?")) r = await post("/api/deliver", { number: +d.deliver, override: true }); $("heard").textContent = r.delivered ? `#${d.deliver} handed over ✔` : (r.error || "Not delivered"); load(); }
  else if (d.free) { await post(`/api/chefs/${d.free}/free`, {}); load(); }
  else if (d.so) { await post("/api/soldout", { id: d.so, soldOut: d.v === "1" }); load(); }
};
let stopB; const talk = $("talk");
const startB = async (e) => { e.preventDefault(); if (stopB) return; talk.classList.add("rec"); let res; const p = new Promise((r) => (res = r)); stopB = res;
  try { const wav = await recordWav(p); stopB = null; talk.classList.remove("rec"); $("heard").textContent = "Processing…"; await send({ audio: wav }); }
  catch (err) { stopB = null; talk.classList.remove("rec"); $("heard").textContent = "Mic: " + err.message; } };
talk.onmousedown = talk.ontouchstart = startB; talk.onmouseup = talk.onmouseleave = talk.ontouchend = () => stopB && stopB();

// ---------------- shared
$("pick").onclick = (e) => { const b = e.target.closest("[data-who]"); if (b) { who = b.dataset.who; ls.set("kwho", who); load(); } };
$("switch").onclick = () => { who = null; ls.set("kwho", ""); load(); };
$("role").onclick = goRole; $("srv").onclick = () => { setServer(true); location.reload(); };
setInterval(() => document.querySelectorAll("[data-since]").forEach((e) => (e.textContent = fmt(Date.now() - +e.dataset.since))), 1000);
events((e) => {
  if (e.type === "task" && e.chefId === who) { beep(); speakText(e.text, e.lang); }         // spoken ONLY on that chef's device
  if (e.type === "order" && who === "board") beep();
  if (e.type === "upcoming" || e.type === "reminder") { beep(); speakText(e.text, e.lang); }   // phone order booked for later / time to start it: every kitchen device
  load();
});
load(); setInterval(load, 15000);
</script></body></html>
